services:
  ros2_control:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: ros2_control:jazzy-dev
    container_name: ros2_control_dev
    stdin_open: true
    tty: true
    volumes:
      - ./src:/workspace/src
    ports:
      # noVNC web client -- open http://localhost:6080/vnc.html in a browser
      # to see the container's virtual desktop. Bound to localhost only.
      - "127.0.0.1:6080:6080"
    environment:
      # Self-contained virtual X display (Xvfb) started by the entrypoint --
      # not the host's XQuartz, which can't satisfy rviz2/Gazebo's GLX needs.
      - DISPLAY=:1
      # Force Mesa's software rasterizer (llvmpipe) instead of trying to
      # negotiate hardware/DRI rendering that isn't available in the container.
      - LIBGL_ALWAYS_SOFTWARE=1
    working_dir: /workspace
