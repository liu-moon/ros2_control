services:
  ros2_control:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: ros2_control:jazzy-dev
    container_name: ros2_control_dev
    stdin_open: true
    tty: true
    volumes:
      - ./src:/workspace/src
    environment:
      # XQuartz on macOS listens over TCP; Docker Desktop resolves this to the host.
      - DISPLAY=host.docker.internal:0
    working_dir: /workspace
